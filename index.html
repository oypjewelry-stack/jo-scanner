<!doctype html>
<html lang="en"><head>
<meta http-equiv="Cache-Control" content="no-cache">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ffffff">
<title>OYP Card Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1792160788">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head><body>
<header class="top"><img class="logo" src="logo.png" alt="OYP Jewelry"><span class="title serif">Card Scanner</span><button id="btnSettings" class="icon" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button></header>

<section id="startView" class="view">
  <h1>Scan a job order card</h1>
  <p class="muted help">Input the JO number, then scan each page.</p>
  <div class="jorow">
    <label for="joInput" class="jopre" aria-hidden="true">JO</label>
    <input id="joInput" aria-label="JO number" class="big" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="26-001">
    <button id="btnMic" class="mic hidden" type="button" aria-label="Say the JO number" aria-pressed="false"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
  </div>
  <button id="btnStart" class="primary">SCAN</button>
  <p id="apiWarn" class="warn hidden">No backend URL set yet. Tap Settings to add it (pages are kept on this phone until then).</p>
</section>

<section id="scanView" class="view hidden">
  <div class="jobar"><span>JO <strong id="joLabel"></strong></span><span id="pageLabel" class="muted"></span></div>
  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="guide"></div>
    <div id="hint" class="hint">Starting camera…</div>
  </div>
  <div class="controls">
    <label class="toggle"><input type="checkbox" id="autoSnap" checked> Auto-snap</label>
    <button id="btnCapture" class="shutter" aria-label="Capture page"></button>
    <label class="toggle"><input type="checkbox" id="doCrop" checked> Crop</label>
  </div>
  <ul id="pages" class="pages"></ul>
  <button id="btnDone" class="primary">Done with this card</button>
</section>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label class="lbl">Apps Script web app URL</label>
    <input id="apiUrl" class="mid" placeholder="https://script.google.com/macros/s/…/exec">
    <label class="lbl">Shared token (optional)</label>
    <input id="apiToken" class="mid" placeholder="token">
    <div class="row"><button value="cancel" class="ghost">Cancel</button><button id="btnSave" value="save" class="primary">Save</button></div>
  </form>
</dialog>
<div id="review" class="review hidden">
  <div class="rvhead"><span id="rvTitle" class="serif">Check the crop</span><span class="muted rvsub">Drag the corners to fit the card</span></div>
  <div id="rvStage" class="rvstage">
    <canvas id="rvCanvas"></canvas>
    <svg id="rvLines" class="rvlines"></svg>
    <div class="handle"></div><div class="handle"></div><div class="handle"></div><div class="handle"></div>
  </div>
  <div class="rvopts"><label class="enh"><input type="checkbox" id="rvEnhance" checked> Enhance</label><img id="rvPreview" class="rvpreview" alt="Preview"></div>
  <div class="rvbar"><button id="rvRetake" class="ghost">Retake</button><button id="rvNoCrop" class="ghost">No crop</button><button id="rvUse" class="primary">Use</button></div>
</div>
<canvas id="work" class="hidden"></canvas>
<div id="toast" class="toast hidden"><img id="toastImg" alt=""><span>Saved</span><button id="toastAdjust" class="ghost">Adjust</button></div>
<script src="detector.js?v=1792160788"></script>
<script src="app.js?v=1792160788"></script>
<script src="voice.js?v=1792160788"></script>
</body></html>
